{% extends 'auth/base_auth.html' %}
{% load static %}

{% block auth_content %}
<style>
    .welcome-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 80vh;
        text-align: center;
    }

    .welcome-text {
        font-size: 3rem;
        font-weight: bold;
        color: #d8c5f2;
        opacity: 0;
        animation: fadeIn 2s ease forwards;
        letter-spacing: 1px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    @keyframes fadeIn {
        0% {
            opacity: 0;
            transform: translateY(20px);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<div class="welcome-container">
    <h1 class="welcome-text">Welcome to Liminal.</h1>
</div>
{% endblock %}
