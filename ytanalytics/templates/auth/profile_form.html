<!-- This is a form template that will be loaded via AJAX -->
<script>
    console.log("Profile form template being rendered");
</script>

<!-- Profile Edit Form -->
<form method="post" action="/edit-profile/" enctype="multipart/form-data" class="space-y-6" id="profile-form">
    {% csrf_token %}
    
    <!-- Account Information -->
    <div class="space-y-4">
        <h3 class="text-lg font-semibold text-[#F5F5DC]">Account Information</h3>
        
        <!-- Username -->
        <div class="space-y-2">
            <label for="id_username" class="block text-sm font-medium text-gray-300">Username</label>
            <input type="text" name="username" id="id_username" value="{{ user.username }}"
                   class="w-full px-3 py-2 bg-[rgba(30,30,30,0.6)] border border-[rgba(245,245,220,0.1)] rounded-lg text-[#F5F5DC] focus:outline-none focus:border-purple-500"
                   maxlength="150" required>
            <p class="text-xs text-gray-400">Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only.</p>
        </div>
    </div>
    
    <!-- Profile Information -->
    <div class="space-y-4">
        <h3 class="text-lg font-semibold text-[#F5F5DC]">Profile Information</h3>
        
        <!-- Bio -->
        <div class="space-y-2">
            <label for="id_bio" class="block text-sm font-medium text-gray-300">Bio</label>
            <textarea name="bio" id="id_bio" rows="4"
                      class="w-full px-3 py-2 bg-[rgba(30,30,30,0.6)] border border-[rgba(245,245,220,0.1)] rounded-lg text-[#F5F5DC] focus:outline-none focus:border-purple-500">{{ user.userprofile.bio }}</textarea>
        </div>
        
        <!-- Location -->
        <div class="space-y-2">
            <label for="id_location" class="block text-sm font-medium text-gray-300">Location</label>
            <input type="text" name="location" id="id_location" value="{{ user.userprofile.location }}"
                   class="w-full px-3 py-2 bg-[rgba(30,30,30,0.6)] border border-[rgba(245,245,220,0.1)] rounded-lg text-[#F5F5DC] focus:outline-none focus:border-purple-500">
        </div>
        
        <!-- Birth Date -->
        <div class="space-y-2">
            <label for="id_birth_date" class="block text-sm font-medium text-gray-300">Birth Date</label>
            <input type="date" name="birth_date" id="id_birth_date" value="{{ user.userprofile.birth_date|date:'Y-m-d' }}"
                   class="w-full px-3 py-2 bg-[rgba(30,30,30,0.6)] border border-[rgba(245,245,220,0.1)] rounded-lg text-[#F5F5DC] focus:outline-none focus:border-purple-500">
        </div>
        
        <!-- Profile Picture -->
        <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-300">Profile Picture</label>
            <div class="flex items-center space-x-4">
                {% if user.userprofile.profile_picture %}
                <img src="{{ user.userprofile.profile_picture.url }}" alt="Current profile picture" 
                     class="w-16 h-16 rounded-full object-cover border-2 border-purple-500">
                {% endif %}
                <div class="flex-1">
                    <label for="id_profile_picture" 
                           class="flex items-center justify-center px-4 py-2 bg-purple-500/10 text-purple-400 rounded-lg hover:bg-purple-500/20 transition-colors cursor-pointer">
                        <i class="fas fa-cloud-upload-alt mr-2"></i>
                        Choose Image
                    </label>
                    <input type="file" name="profile_picture" id="id_profile_picture" accept="image/*" class="hidden">
                    <p class="mt-1 text-xs text-gray-400" id="selected-file">No file selected</p>
                </div>
            </div>
        </div>
        
        <!-- YouTube Channel -->
        <div class="space-y-2">
            <label for="id_youtube_channel" class="block text-sm font-medium text-gray-300">YouTube Channel</label>
            <input type="text" name="youtube_channel" id="id_youtube_channel" value="{{ user.userprofile.youtube_channel }}"
                   class="w-full px-3 py-2 bg-[rgba(30,30,30,0.6)] border border-[rgba(245,245,220,0.1)] rounded-lg text-[#F5F5DC] focus:outline-none focus:border-purple-500">
            <p class="text-xs text-gray-400">Enter your YouTube channel URL or channel ID. Leave empty if you don't have a channel.</p>
        </div>
    </div>
    
    <!-- Submit Button -->
    <div class="pt-4">
        <button type="submit" class="w-full px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors">
            Save Changes
        </button>
    </div>
</form>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const fileInput = document.getElementById('id_profile_picture');
        const fileLabel = document.getElementById('selected-file');
        
        if (fileInput && fileLabel) {
            fileInput.addEventListener('change', function() {
                if (fileInput.files.length > 0) {
                    fileLabel.textContent = fileInput.files[0].name;
                } else {
                    fileLabel.textContent = 'No file selected';
                }
            });
        }
        
        // Handle form submission
        const form = document.getElementById('profile-form');
        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const formData = new FormData(form);
                
                fetch('/edit-profile/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    credentials: 'include'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Close modal and reload page to show updates
                        closeProfileModal();
                        location.reload();
                    } else if (data.html) {
                        // Replace form content with error messages
                        document.getElementById('profileModalContent').innerHTML = data.html;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            });
        }
    });
</script>
