{% extends 'base.html' %}

{% block content %}
<div class="dashboard-container">
    <h1 class="dashboard-title">Ready To Enter Your Liminal State?</h1>
    <div class="dashboard-content">
        <div class="login-button">
            <a href="#" id="openLoginModal">Sign In</a>
        </div>
    </div>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title">Login to Liminal</h2>
            <button class="modal-close" id="closeLoginModal">×</button>
        </div>
        <div class="modal-content">
            <div class="login-options">
                <a href="{% url 'social:begin' 'google-oauth2' %}?next=/dashboard/" class="google-signin-btn">
                    <span class="google-icon-container"><i class="fab fa-google"></i></span>
                    <span class="google-text">Continue with Google</span>
                </a>
                <div class="login-divider">
                    <span>or</span>
                </div>
                <form method="post" action="{% url 'login' %}" class="login-form">
                    {% csrf_token %}
                    <div class="form-group">
                        <input type="text" name="username" id="id_username" placeholder="Enter your username" required>
                    </div>
                    <div class="form-group">
                        <input type="password" name="password" id="id_password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="regular-signin-btn">Continue</button>
                </form>
                <div class="signup-link">
                    <p>Don't have an account? <a href="{% url 'signup' %}">Create one</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .dashboard-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
        padding: 20px;
    }

    .dashboard-title {
        font-size: 2.5rem;
        color: #F5F5DC;
        margin-bottom: 30px;
        font-weight: bold;
        text-align: center;
        opacity: 0;
        animation: fadeIn 1s ease forwards;
    }

    .dashboard-content {
        background-color: rgba(74, 59, 110, 0.3);
        padding: 20px 40px;
        border-radius: 15px;
        width: 90%;
        max-width: 600px;
        backdrop-filter: blur(10px);
        opacity: 0;
        animation: slideUp 1s ease forwards;
        animation-delay: 0.3s;
        position: relative;
        min-height: 45px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    .dashboard-content:hover {
        background-color: rgba(74, 59, 110, 0.5);
    }

    .login-button {
        opacity: 0;
        transform: scale(0.9);
        transition: all 0.3s ease;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    .dashboard-content:hover .login-button {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

    .login-button a {
        display: inline-block;
        padding: 12px 24px;
        background-color: #4A3B6E;
        color: #F5F5DC;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .login-button a:hover {
        background-color: #5A4B7E;
        transform: translateY(-2px);
    }

    /* Modal styles */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .modal {
        position: relative;
        width: 90%;
        max-width: 400px;
        background-color: #1e1e1e;
        border-radius: 15px;
        padding: 0;
        color: #F5F5DC;
        animation: modalFadeIn 0.3s ease;
        overflow: hidden;
    }

    @keyframes modalFadeIn {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        background-color: rgba(74, 59, 110, 0.2);
        border-bottom: 1px solid rgba(245, 245, 220, 0.1);
    }

    .modal-title {
        font-size: 1.5rem;
        font-weight: bold;
        margin: 0;
        color: #F5F5DC;
    }

    .modal-close {
        font-size: 24px;
        color: #F5F5DC;
        background: none;
        border: none;
        cursor: pointer;
        transition: transform 0.3s ease;
    }

    .modal-close:hover {
        transform: scale(1.2);
    }

    .modal-content {
        padding: 30px;
    }

    .login-options {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        width: 100%;
    }

    .login-form {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .form-group {
        width: 100%;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid rgba(245, 245, 220, 0.3);
        background-color: rgba(30, 30, 30, 0.9);
        color: #F5F5DC;
        font-family: 'SF Pro Display', sans-serif;
        box-sizing: border-box;
    }

    .form-group input:focus {
        outline: none;
        border-color: #4A3B6E;
    }

    .google-signin-btn, .regular-signin-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: bold;
        transition: all 0.3s ease;
        text-decoration: none;
        font-size: 1rem;
        border: none;
        cursor: pointer;
    }

    .google-signin-btn {
        background-color: #4285F4;
        color: white;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        position: relative;
        padding: 0;
        overflow: hidden;
        height: 48px;
    }

    .google-signin-btn:hover {
        background-color: #357ae8;
        transform: translateY(-2px);
    }
    
    .google-icon-container {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        margin-right: 0;
        background-color: white;
    }
    
    .google-signin-btn i {
        font-size: 18px;
        color: #4285F4;
    }
    
    .google-text {
        flex: 1;
        text-align: center;
        padding-right: 24px;
        font-family: 'SF Pro Display', sans-serif;
        font-weight: 500;
    }

    .regular-signin-btn {
        background: linear-gradient(45deg, #4A3B6E, #6a5aad);
        color: #F5F5DC;
    }

    .regular-signin-btn:hover {
        background: linear-gradient(45deg, #5a4b7e, #7a6abd);
        transform: translateY(-2px);
    }

    .login-divider {
        display: flex;
        align-items: center;
        width: 100%;
        margin: 15px 0;
    }

    .login-divider::before,
    .login-divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid rgba(245, 245, 220, 0.3);
    }

    .login-divider span {
        padding: 0 10px;
        color: rgba(245, 245, 220, 0.7);
        font-size: 0.9rem;
    }

    .signup-link {
        margin-top: 20px;
        font-size: 0.9rem;
        color: rgba(245, 245, 220, 0.8);
        text-align: center;
    }

    .signup-link a {
        color: #6a5aad;
        text-decoration: none;
        font-weight: bold;
    }

    .signup-link a:hover {
        text-decoration: underline;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const openLoginModal = document.getElementById('openLoginModal');
    const closeLoginModal = document.getElementById('closeLoginModal');
    const loginModal = document.getElementById('loginModal');
    
    // Modal functionality
    openLoginModal.addEventListener('click', function(e) {
        e.preventDefault();
        loginModal.style.display = 'flex';
        document.body.style.overflow = 'hidden'; // Prevent scrolling
    });
    
    closeLoginModal.addEventListener('click', function() {
        loginModal.style.display = 'none';
        document.body.style.overflow = ''; // Enable scrolling
    });
    
    // Close modal when clicking outside
    loginModal.addEventListener('click', function(e) {
        if (e.target === loginModal) {
            loginModal.style.display = 'none';
            document.body.style.overflow = ''; // Enable scrolling
        }
    });
});
</script>
{% endblock %}
